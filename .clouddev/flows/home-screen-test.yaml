# Maestro Flow: Home Screen Test
# Tests the Android home screen is accessible
# Generated by CloudDev Extension

appId: com.google.android.apps.nexuslauncher
---
# Wait for any app to be ready
- waitForAnimationToEnd

# Take a screenshot of the home screen
- takeScreenshot: home-screen

# Try to open the app drawer (swipe up)
- swipe:
    direction: UP
    duration: 500

# Wait for animation
- waitForAnimationToEnd

# Take another screenshot
- takeScreenshot: app-drawer

# Swipe back down
- swipe:
    direction: DOWN
    duration: 500
